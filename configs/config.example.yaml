env:
  checkpoint_dir: ./checkpoints/
  results_dir: ./results/
  device: cuda
  seed: 42
  data_root: ./data
  raw_data_dir: ./data/CPSC_Data
  csv_path: ./data/CPSC_Data/REFERENCE.csv
  data_dir: ./data/CPSC_Data/processed_sr100_freq10
  ptb_raw_dir: ./data/PTB_Data
  ptb_processed_dir: ./data/PTB_Data/processed
  chapman_data_dir: ./data/Chapman_Data/processed_sr100_freq10
  chapman_folds_path: ./data/Chapman_Data/chapman_folds.csv

train:
  batch_size: 32
  learning_rate: 0.0001
  num_epochs: 50
  weight_decay: 0.0001

model:
  dgnn_layers: 2
  hidden_dim: 64
  num_nodes: 12
  edge_dropout: 0.5

loss:
  alpha: 0.2
  temperature: 0.1
  smooth_weight: true
  focal_alpha: 0.25
  focal_gamma: 2.0
